name: Build and release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Prepare release APK name
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION="${VERSION#v}"
          BUILT="app/build/outputs/apk/release/mindful-1.0.apk"
          if [ ! -f "$BUILT" ]; then
            BUILT=$(ls app/build/outputs/apk/release/*.apk | head -1)
          fi
          RELEASE_APK="mindful-${VERSION}.apk"
          cp "$BUILT" "$RELEASE_APK"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          ls -la "$RELEASE_APK"

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mindful ${{ github.ref_name }} — Unlock prompts
          files: ${{ env.RELEASE_APK }}
          fail_on_unmatched_files: true
          make_latest: true

      - name: Upload APK artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK }}
          path: ${{ env.RELEASE_APK }}
